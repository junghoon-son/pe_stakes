<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Preeclampsia Graph</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            background-color: #f4f4f4;
        }
        #graph-container {
            width: 90%;
            max-width: 1000px;
            height: 600px;
            border: 1px solid #ccc;
            background-color: #fff;
            margin-top: 20px;
            position: relative; /* Needed for absolute positioning of info */
        }
        #main-title {
            position: absolute;
            top: 10px;
            left: 10px;
            margin: 0;
            padding: 5px 10px;
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            z-index: 10; /* Ensure it's above SVG */
        }
        #node-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            max-width: 250px;
            font-size: 12px;
            display: none; /* Hidden by default */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        #node-info h3 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 14px;
        }
         #node-info p {
            margin-bottom: 5px;
        }
        .links line {
            stroke: #999;
            stroke-opacity: 0.6;
        }
        .nodes circle {
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
        }
        .nodes .node-label {
            /* font-size: 10px; Defined in JS now */
            fill: #333; /* Darker text color */
            paint-order: stroke; /* Draw stroke behind fill */
            stroke: #fff; /* White stroke for halo effect */
            stroke-width: 0.5px; 
            stroke-linecap: butt;
            stroke-linejoin: miter;
            font-size: 10px;
            pointer-events: none; /* Prevent text from interfering with drag */
            text-anchor: middle;
            /* dy is set dynamically in JS now */
        }
        .nodes .label-bg {
             pointer-events: none; /* Background shouldn't block clicks */
        }
        /* Style for group hulls (optional visual grouping) */
        .group-hull {
            fill-opacity: 0.05; /* Make even fainter */
            stroke: #666;
            stroke-width: 1px;
            stroke-linejoin: round;
            cursor: move; /* Indicate draggability */
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            padding: 8px 12px;
            background-color: rgba(238, 238, 238, 0.85);
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 11px;
            z-index: 10; /* Ensure it's above SVG */
            width: auto; /* Let content determine width */
            /* Remove fixed width/max-width from inline style */
        }
        #controls label {
             margin-right: 5px;
        }
         #controls input[type="range"] {
             width: 150px; /* Adjust width as needed */
             vertical-align: middle;
         }
         #controls span {
             display: inline-block;
             min-width: 30px; /* Space for percentage */
             text-align: right;
             margin-left: 5px;
         }
    </style>
</head>

            nodeCodes.text(codesText.trim() ? `Codes: ${codesText}` : "");
            nodeInfoPanel.style("display", "block");
        }

        function hideNodeInfo() {
            nodeInfoPanel.style("display", "none");
        }
        
        // --- Reachability and Filtering ---
        const evidenceSlider = d3.select("#evidenceSlider");
        const evidenceValueDisplay = d3.select("#evidenceValue");
        const inactiveColor = "#cccccc"; // Gray for inactive nodes
        const inactiveOpacity = 0.15;
        const transitionDuration = 500; // ms for smooth transition

        function findReachableNodes(startNodeId, threshold) {
            const reachable = new Set();
            const queue = [startNodeId];
            const nodesById = new Map(preeclampsiaData.nodes.map(n => [n.id, n]));

            if (!nodesById.has(startNodeId)) return reachable; // Start node doesn't exist

            reachable.add(startNodeId);

            while (queue.length > 0) {
                const currentNodeId = queue.shift();

                // Find neighbors connected by links meeting the threshold
                preeclampsiaData.links.forEach(link => {
                    if ((link.evidence || 0) >= threshold) {
                        let neighborNodeId = null;
                        // Check if the link connects the current node to an unvisited neighbor
                        if (link.source.id === currentNodeId && !reachable.has(link.target.id)) {
                            neighborNodeId = link.target.id;
                        } else if (link.target.id === currentNodeId && !reachable.has(link.source.id)) {
                            neighborNodeId = link.source.id;
                        }

                        if (neighborNodeId) {
                            reachable.add(neighborNodeId);
                            queue.push(neighborNodeId);
                        }
                    }
                });
            }
            return reachable;
        }

        function updateNodeAppearance(reachableNodes) {
            node // D3 selection of all node <g> elements
                .transition()
                .duration(transitionDuration)
                .style("opacity", d => reachableNodes.has(d.id) ? 1 : inactiveOpacity) // Adjust group opacity
                .select("circle") // Select the circle within the group
                .attr("fill", d => reachableNodes.has(d.id) ? convertColor(d.color) : inactiveColor);

             // Also fade out links that are below threshold or connected to faded nodes
            link // D3 selection of all link <line> elements
                 .each(function(d) { // Set isVisible flag on the data itself
                     const threshold = parseInt(evidenceSlider.property("value"));
                     const sourceReachable = reachableNodes.has(d.source.id);
                     const targetReachable = reachableNodes.has(d.target.id);
                     const evidenceMet = (d.evidence || 0) >= threshold;
                     d.isVisible = (evidenceMet && sourceReachable && targetReachable);
                 })
                 .transition()
                 .duration(transitionDuration)
                 .style("opacity", d => d.isVisible ? 0.6 : 0.05); // Use original opacity or very low
            
            // Potentially hide/show particles based on link visibility?
            // For simplicity, let's just let them run, but they might look odd on faded links.
            // To hide: filter activeParticles based on link visibility here.
        }

        // --- Slider Event Listener ---
        evidenceSlider.on("input", function() {
            const threshold = parseInt(this.value);
            evidenceValueDisplay.text(threshold + "%");

            const reachable = findReachableNodes('PE', threshold); // Assuming 'PE' is the main node
            updateNodeAppearance(reachable);
        });

        // --- Initial Appearance Update ---
        function initializeGraphState() {
             const initialThreshold = parseInt(evidenceSlider.property("value"));
             evidenceValueDisplay.text(initialThreshold + "%");
             const initialReachable = findReachableNodes('PE', initialThreshold);
             updateNodeAppearance(initialReachable);
        }
        
        // --- Convert Color Function ---
        // D3 works better with CSS color strings
        function convertColor(hexColor) {
            // Ensure it's a number
            if (typeof hexColor !== 'number') {
                 console.warn("Invalid color input, defaulting to gray:", hexColor);
                 return "#808080"; // Default grey
            }
            // Convert number to hex string (e.g., 0xff5555 -> "ff5555")
             // Add leading zeros if needed to ensure 6 digits
            return "#" + hexColor.toString(16).padStart(6, '0');
        }
        
        // --- Grouping Data ---
        const groups = [...new Set(preeclampsiaData.nodes.map(d => d.group))];
        const groupData = groups.map(group => ({
            id: group,
            nodes: preeclampsiaData.nodes.filter(n => n.group === group)
        }));

        // Map group IDs to consistent colors including new groups
        // Extend the color scheme or define explicitly
        const groupColorMap = {
            'core': '#ff5555', // Keep original colors where meaningful
            'definition': '#5555ff',
            'pathophysiology': '#55ff55',
            'manifestations': '#ffaa55',
            'management': '#aa55ff',
            'severity': '#ff5555', // Match PE color
            'complications': '#ff55aa',
            'alternatives': '#aaaaaa',
            'risk': '#00ced1',       // DarkTurquoise
            'prevent': '#98fb98',     // PaleGreen
            'diag': '#ffd700',       // Gold
            'lab_detail': '#ffaa55',  // Same as manifestations
            'post': '#87ceeb'        // SkyBlue
        };
        // Fallback scale for any groups not in the map (though all should be)
        const fallbackColorScale = d3.scaleOrdinal(d3.schemeCategory10); 
        const groupFillColors = (groupId) => groupColorMap[groupId] || fallbackColorScale(groupId);

        // --- Force Simulation ---
        const simulation = d3.forceSimulation(preeclampsiaData.nodes)
            .force("link", d3.forceLink(preeclampsiaData.links).id(d => d.id).distance(50).strength(0.5))
            .force("charge", d3.forceManyBody().strength(-250)) // Increased Repulsion
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collide", d3.forceCollide().radius(d => (d.size || 1) * 10 + 15).strength(0.8)); // Increase padding and strength for better separation

        // --- Drawing Elements ---
        // Optional: Group Hulls (visual boundaries)
        const hullGroup = g.append("g").attr("class", "group-hulls");

        const link = g.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(preeclampsiaData.links)
            .enter().append("line")
            .attr("stroke-width", d => {
                const minWidth = 1;
                const maxWidth = 8;
                const maxCount = 2000; // Adjust if data changes
                const normalizedCount = (d.patientCount || 0) / maxCount;
                return minWidth + normalizedCount * (maxWidth - minWidth);
            });

        const node = g.append("g")
            .attr("class", "nodes")
            .selectAll("g") // Group circle and text together
            .data(preeclampsiaData.nodes)
            .enter().append("g")
            .call(drag(simulation)) // Apply drag behavior
            .on("click", showNodeInfo)
            .on("mouseover", (event, d) => {
                 d3.select(event.currentTarget).select('circle').attr('stroke', 'black').attr('stroke-width', 3);
            })
            .on("mouseout", (event, d) => {
                 d3.select(event.currentTarget).select('circle').attr('stroke', '#fff').attr('stroke-width', 1.5);
                 // Optionally hide info panel on mouseout if not clicked/sticky
                 // hideNodeInfo(); 
            });

        const labelPadding = 3;
        const labelFontSize = 10;
        const labelYOffset = 10; // Base Y offset from circle center

        node.append("circle")
            .attr("r", d => (d.size || 1) * 10) // Base size * 10 for visibility
            .attr("fill", d => convertColor(d.color));

        node.append("text")
            .attr("class", "node-label") // Add class for easier selection
            .text(d => d.label)
            .attr("x", 0)
            .attr("y", d => -((d.size || 1) * 10 + labelYOffset)) // Position above the circle + offset
            .style("font-size", `${labelFontSize}px`)
            .style("text-anchor", "middle");

        // Add background rectangle AFTER text is added and measured
        node.each(function(d) {
            const group = d3.select(this);
            const textElement = group.select(".node-label").node();
            if (!textElement) return;

            const bbox = textElement.getBBox(); // Get bounding box of the text
            
            group.insert("rect", ".node-label") // Insert rect before the text
                .attr("class", "label-bg")
                .attr("x", bbox.x - labelPadding)
                .attr("y", bbox.y - labelPadding)
                .attr("width", bbox.width + labelPadding * 2)
                .attr("height", bbox.height + labelPadding * 2)
                .attr("rx", 3) // Rounded corners
                .attr("ry", 3)
                .style("fill", "#ffffff")
                .style("fill-opacity", 0.75); // Semi-transparent white
        });

        // --- Convex Hull Function ---
        // Function to compute the convex hull polygon points for a set of nodes
        function computeConvexHull(nodes) {
            const points = nodes.map(node => [node.x, node.y]);
             // Add small padding points around each node to make the hull larger
            const padding = 15;
            const paddedPoints = [];
            nodes.forEach(node => {
                paddedPoints.push([node.x - padding, node.y - padding]);
                paddedPoints.push([node.x + padding, node.y - padding]);
                paddedPoints.push([node.x - padding, node.y + padding]);
                paddedPoints.push([node.x + padding, node.y + padding]);
            });
            
            if (paddedPoints.length < 3) return null; // Need at least 3 points for a hull
            return d3.polygonHull(paddedPoints);
        }

        // --- Line generator for smooth hulls ---
        const lineGenerator = d3.line()
            .curve(d3.curveCatmullRomClosed.alpha(0.7)); // Adjust alpha for smoothness (0=uniform, 1=chordal)

        // --- Simulation Tick ---
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);

            // Update convex hulls for groups
            hullGroup.selectAll("path")
                .data(groupData.filter(g => g.nodes.length > 1)) // Only draw hulls for groups with > 1 node
                .join("path")
                .attr("d", d => {
                    const hullPoints = computeConvexHull(d.nodes);
                    // Use the line generator for a smooth path
                    return hullPoints ? lineGenerator(hullPoints) : null;
                })
                .attr("fill", d => groupFillColors(d.id))
                .style("fill-opacity", 0.05)
                .attr("stroke", d => d3.color(groupFillColors(d.id)).darker(0.5))
                .style("pointer-events", "all") // Make hull draggable
                .call(dragGroup(simulation)); // Apply drag behavior to hulls

        });
        
        // --- Drag Functions ---
        function drag(simulation) {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
                hideNodeInfo(); // Hide info panel during drag
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                 // Keep node fixed after drag:
                // d.fx = event.x; 
                // d.fy = event.y;
                // Or release the node (let simulation position it):
                 d.fx = null;
                 d.fy = null;
                 showNodeInfo(event, d); // Re-show info for the dragged node
            }

            function stopParticles() {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                // Optional: Clear existing particles immediately on drag start
                // activeParticles = []; 
                // particleGroup.selectAll("circle").remove();
            }

            function startParticles() {
                if (!animationFrameId) {
                    animateParticles();
                }
            }

            return d3.drag()
                .on("start", (event, d) => {
                    dragstarted(event, d);
                    stopParticles(); // Stop animation on drag start
                })
                .on("drag", dragged)
                .on("end", (event, d) => {
                    dragended(event, d);
                    startParticles(); // Restart animation on drag end
                });
        }
        
         // Drag function specifically for group hulls
        function dragGroup(simulation) {
            let groupNodes = [];
            
            function dragstarted(event, d) {
                 if (!event.active) simulation.alphaTarget(0.3).restart();
                 groupNodes = d.nodes; // Get nodes for the dragged group
                 groupNodes.forEach(node => {
                     node.fx = node.x; // Fix current positions
                     node.fy = node.y;
                 });
                 hideNodeInfo();
            }

            function dragged(event, d) {
                 // Calculate the delta movement
                 const dx = event.x - event.subject.x;
                 const dy = event.y - event.subject.y;

                // Apply delta to all nodes in the group
                 groupNodes.forEach(node => {
                     node.fx += dx;
                     node.fy += dy;
                 });
                 
                 // Update the drag subject's position for correct delta calculation next time
                 event.subject.x = event.x;
                 event.subject.y = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                 // Release the nodes in the group
                 groupNodes.forEach(node => {
                     node.fx = null;
                     node.fy = null;
                 });
                 groupNodes = []; // Clear the stored nodes
            }
            
            function stopParticles() {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                 // Optional: Clear existing particles immediately on drag start
                // activeParticles = [];
                // particleGroup.selectAll("circle").remove();
            }

            function startParticles() {
                if (!animationFrameId) {
                    animateParticles();
                }
            }

            // Need to manually manage subject for group drag, as 'd' is group data, not node data
            return d3.drag()
                .subject(event => ({x: event.x, y: event.y})) // Store initial drag point
                .on("start", (event, d) => {
                     dragstarted(event, d);
                     stopParticles(); // Stop animation on group drag start
                 })
                .on("drag", dragged)
                .on("end", (event, d) => {
                     dragended(event, d);
                     startParticles(); // Restart animation on group drag end
                 });
        }


        // Add zoom/pan capabilities (optional)
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4]) // Zoom range
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // Close info panel if clicking outside nodes/info panel
        svg.on("click", (event) => {
             // Check if the click target is the SVG background or a link/hull
             const target = event.target;
             if (target.tagName === 'svg' || target.tagName === 'line' || target.classList.contains('group-hull')) {
                hideNodeInfo();
            }
        });
        nodeInfoPanel.on("click", (event) => {
            event.stopPropagation(); // Prevent clicks inside the panel from closing it
        });

        // --- Particle Setup ---
        const particleGroup = g.insert("g", ".nodes") // Insert before nodes
                             .attr("class", "particles");

        let activeParticles = [];
        const maxParticlesPerLink = 30; // Limit total particles per link
        const particleBaseSpeed = 0.5; // Base speed (pixels per frame)
        const particleBaseEmissionRate = 0.05; // Base chance per frame
        let animationFrameId = null; // To control the animation loop

        // --- Particle Animation Loop ---
        function animateParticles() {
            // 1. Emit New Particles
            preeclampsiaData.links.forEach(link => {
                // Only emit on links that are currently visible based on the slider
                if (!link.isVisible) return; 

                // Check source/target have positions
                if (!link.source.x || !link.target.x) return;

                // Determine emission chance based on patient count
                const maxCount = 2000;
                const normalizedCount = (link.patientCount || 0) / maxCount;
                const emissionChance = particleBaseEmissionRate + normalizedCount * 0.2; // Higher count = higher chance

                // Count current particles for this link
                const currentParticlesOnLink = activeParticles.filter(p => p.link === link).length;

                // Emit based on chance and limit
                if (Math.random() < emissionChance && currentParticlesOnLink < maxParticlesPerLink) {
                    // Determine particle properties
                    const speed = particleBaseSpeed * (0.8 + Math.random() * 0.4); // Slight speed variation
                    const size = 1.5 + Math.sqrt(link.evidence || 1) / 5; // Size based on evidence
                    const color = convertColor(link.source.color || 0x808080); // Color from source node

                    activeParticles.push({
                        link: link,
                        progress: 0, // Start at source
                        speed: speed,
                        size: size,
                        color: color,
                        id: Date.now() + Math.random() // Unique ID for D3 key
                    });
                }
            });

            // 2. Update Existing Particles
            const nextActiveParticles = [];
            activeParticles.forEach(particle => {
                // Remove particle instantly if its link becomes invisible
                if (!particle.link.isVisible) {
                    return; // Skip to next particle, effectively removing this one
                }

                const sourcePos = { x: particle.link.source.x, y: particle.link.source.y };
                const targetPos = { x: particle.link.target.x, y: particle.link.target.y };
                const dx = targetPos.x - sourcePos.x;
                const dy = targetPos.y - sourcePos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 1) { // Avoid division by zero if nodes overlap
                    particle.progress = 1;
                } else {
                    // Move particle along the link
                    const travel = particle.speed / dist;
                    particle.progress += travel;
                }

                // Keep particle if it hasn't reached the end
                if (particle.progress < 1) {
                    // Calculate current position
                    particle.x = sourcePos.x + dx * particle.progress;
                    particle.y = sourcePos.y + dy * particle.progress;
                    nextActiveParticles.push(particle);
                }
            });
            activeParticles = nextActiveParticles;

            // 3. Update SVG Elements
            particleGroup.selectAll("circle")
                .data(activeParticles, d => d.id) // Use unique ID as key
                .join(
                    enter => enter.append("circle")
                        .attr("r", d => d.size)
                        .attr("fill", d => d.color)
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y),
                    update => update
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y),
                    exit => exit.remove()
                );

            // 4. Request Next Frame
            animationFrameId = requestAnimationFrame(animateParticles);
        }

        // --- Start the Animation ---
        // If simulation needs time to settle before initial check, use a timeout
        // setTimeout(() => {
        //     initializeGraphState(); 
        //     if (animationFrameId) cancelAnimationFrame(animationFrameId);
        //     animateParticles();
        // }, 500); // e.g., wait 500ms

        // Start immediately (might look odd briefly if sim hasn't run)
        initializeGraphState();
        if (animationFrameId) cancelAnimationFrame(animationFrameId); 
        animateParticles();

    </script>
